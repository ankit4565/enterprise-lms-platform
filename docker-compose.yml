

services:
  postgres:
    image: postgres:16
    container_name: enterprise-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: