server:
  port: 8084

spring:
  application:
    name: media-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lms_media}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket-name: ${S3_BUCKET:enterprise-lms-media}
    region: ${S3_REGION:us-east-1}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    cdn-base-url: ${CDN_BASE_URL:http://localhost:9000/enterprise-lms-media}

media:
  limits:
    video-max-bytes: 2147483648       # 2 GB
    document-max-bytes: 52428800     # 50 MB
    image-max-bytes: 5242880         # 5 MB
    default-part-size: 10485760      # 10 MB
  presigned-expiry-seconds: 86400    # 24 hours for upload
  stream-expiry-seconds: 1800        # 30 minutes for playback stream
