spring:
  datasource:
    url: jdbc:h2:mem:media_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

storage:
  s3:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: enterprise-lms-media-test
    region: us-east-1
    path-style-access: true
    cdn-base-url: http://localhost:9000/enterprise-lms-media-test

media:
  limits:
    video-max-bytes: 2147483648
    document-max-bytes: 52428800
    image-max-bytes: 5242880
    default-part-size: 10485760
  presigned-expiry-seconds: 86400
  stream-expiry-seconds: 1800
